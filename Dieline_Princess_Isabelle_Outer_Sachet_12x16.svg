<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%">
  <defs>
    <style>
      .cut-line { stroke: #E60039; stroke-width: 2; fill: none; }
      .crease-line { stroke: #0088FF; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
      .seal-area { fill: #E1BEE7; stroke: #8E24AA; stroke-dasharray: 3,3; stroke-width: 1; opacity: 0.35; }
      .foil-gold { fill: url(#goldGradSachet); stroke: #B8860B; stroke-width: 1; }
      .dim-line { stroke: #555555; stroke-width: 1; marker-start: url(#arr3); marker-end: url(#arr3); }
      .dim-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #222222; font-weight: bold; text-anchor: middle; }
      .label-title { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; fill: #4B286D; font-weight: bold; }
      .label-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #666666; }
      .tear-mark { stroke: #E60039; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arr3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="goldGradSachet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A9"/>
      <stop offset="50%" stop-color="#FFDE8A"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="sachetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF7FD"/>
      <stop offset="50%" stop-color="#F3E9F8"/>
      <stop offset="100%" stop-color="#E8DAF0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FCFBFF"/>
  <rect x="25" y="25" width="1050" height="800" rx="12" fill="#FFFFFF" stroke="#E5D9F2" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(60, 65)">
    <text class="label-title" x="0" y="0">PRINCESS ISABELLE — FACIAL MASK SACHET (ซองมาส์กหน้าพร้อมเซรั่มในตัว 12 × 16 CM)</text>
    <text class="label-sub" x="0" y="20">Size: 120 mm (W) × 160 mm (H) • แผ่นมาส์กชุบเซรั่มเข้มข้นรังไหมทองคำบรรจุพร้อมใช้ในซองเดียวกัน (Net Wt. 25g – 30ml)</text>
    <text class="label-sub" x="0" y="36">Substrate: Matte PET 12µ / AL 7µ / NY 15µ / LLDPE 80µ (Total 114µ High-Barrier Foil) • Dual Easy-Tear V-Notches (20 mm from top)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(750, 50)">
    <rect width="270" height="85" rx="8" fill="#F8F6FC" stroke="#D1C4E9" stroke-width="1"/>
    <text x="15" y="18" font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="bold" fill="#333">SACHET CAD LEGEND</text>
    <line x1="15" y1="32" x2="45" y2="32" class="cut-line"/>
    <text x="55" y="35" font-family="'Segoe UI', sans-serif" font-size="10px" fill="#444">Outer Edge / Die Cut (120 × 160 mm)</text>
    <rect x="15" y="44" width="30" height="10" class="seal-area"/>
    <text x="55" y="52" font-family="'Segoe UI', sans-serif" font-size="10px" fill="#444">8-10 mm Heat-Seal Margin (แถบซีลความร้อน)</text>
    <path d="M 20,68 L 30,68 L 25,74 Z" fill="#E60039"/>
    <text x="55" y="71" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="bold" fill="#E60039">V-Cut Easy-Tear Notch (รอยบากฉีก)</text>
  </g>

  <!-- Two Panels: Front Sachet Face & Back Sachet Face -->
  <!-- Scale: 1 mm ~ 2 px -> 120mm = 240px, 160mm = 320px -->
  <g transform="translate(140, 180)">
    <!-- FRONT SACHET -->
    <g transform="translate(0, 0)">
      <!-- Outer Cut Edge (120 x 160 mm -> 240 x 320 px) -->
      <rect x="0" y="0" width="240" height="320" rx="4" fill="url(#sachetBg)" class="cut-line"/>

      <!-- Heat Seal Borders: 8mm sides (16px), 10mm top/bottom (20px) -->
      <!-- Top Seal -->
      <rect x="0" y="0" width="240" height="20" class="seal-area"/>
      <!-- Bottom Seal -->
      <rect x="0" y="300" width="240" height="20" class="seal-area"/>
      <!-- Left Seal -->
      <rect x="0" y="20" width="16" height="280" class="seal-area"/>
      <!-- Right Seal -->
      <rect x="224" y="20" width="16" height="280" class="seal-area"/>

      <!-- V-Notches at 20mm from top edge (y = 40px) -->
      <path d="M 0,36 L 8,40 L 0,44 Z" fill="#E60039"/>
      <path d="M 240,36 L 232,40 L 240,44 Z" fill="#E60039"/>

      <!-- Front Graphic Design & Foil Embellishment -->
      <g transform="translate(120, 60)">
        <!-- Gold Luxury Emblem -->
        <circle cx="0" cy="0" r="16" fill="url(#goldGradSachet)" stroke="#B8860B" stroke-width="1"/>
        <path d="M -8,-6 C -8,-14 8,-14 8,-6 C 8,2 -8,2 -8,10 L 8,10" fill="none" stroke="#6A1B9A" stroke-width="1.8"/>
        
        <!-- Wordmark -->
        <text font-family="'Playfair Display', Georgia, serif" font-size="18px" font-weight="bold" fill="#4B286D" text-anchor="middle" x="0" y="36">Princess Isabelle</text>
        <text font-family="'Segoe UI', sans-serif" font-size="8px" letter-spacing="2" fill="#B8860B" font-weight="bold" text-anchor="middle" x="0" y="48">BEAUTY WOVEN IN SILK</text>

        <!-- Divider Line with Diamond -->
        <line x1="-50" y1="58" x2="50" y2="58" stroke="#D4AF37" stroke-width="1"/>
        <polygon points="0,55 3,58 0,61 -3,58" fill="#D4AF37"/>

        <!-- Product Name -->
        <text font-family="'Playfair Display', Georgia, serif" font-size="13px" font-weight="bold" fill="#3E2055" text-anchor="middle" x="0" y="80">GOLDEN SILK FACIAL MASK</text>
        
        <!-- Badge for All-in-One Pre-Soaked Mask -->
        <rect x="-70" y="94" width="140" height="24" rx="12" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="8.5px" font-weight="bold" fill="#7B1FA2" text-anchor="middle" x="0" y="106">INTENSE NOURISHING FACIAL MASK</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7px" fill="#666" text-anchor="middle" x="0" y="114">Silk Sheet Pre-Infused with 25g/30ml Serum</text>

        <!-- Silk Illustration Accent -->
        <path d="M -60,135 Q 0,115 60,135 Q 0,155 -60,135 Z" fill="#F3E5F5" stroke="#CE93D8" stroke-width="0.8"/>
        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#8E24AA" text-anchor="middle" x="0" y="138">Bio-Silk Peptides • Royal Glow Formula</text>

        <text font-family="'Segoe UI', sans-serif" font-size="8px" font-weight="bold" fill="#B8860B" text-anchor="middle" x="0" y="195">1 SHEET MASK (25 g / 30 ml e)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7px" fill="#777" text-anchor="middle" x="0" y="206">DERMATOLOGICALLY TESTED</text>
      </g>

      <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4B286D" text-anchor="middle" x="120" y="350">FRONT VIEW (ด้านหน้า)</text>
    </g>

    <!-- BACK SACHET -->
    <g transform="translate(420, 0)">
      <!-- Outer Cut Edge (120 x 160 mm -> 240 x 320 px) -->
      <rect x="0" y="0" width="240" height="320" rx="4" fill="url(#sachetBg)" class="cut-line"/>

      <!-- Heat Seal Borders -->
      <rect x="0" y="0" width="240" height="20" class="seal-area"/>
      <rect x="0" y="300" width="240" height="20" class="seal-area"/>
      <rect x="0" y="20" width="16" height="280" class="seal-area"/>
      <rect x="224" y="20" width="16" height="280" class="seal-area"/>

      <!-- V-Notches -->
      <path d="M 0,36 L 8,40 L 0,44 Z" fill="#E60039"/>
      <path d="M 240,36 L 232,40 L 240,44 Z" fill="#E60039"/>

      <!-- Back Graphic Design: Instructions & Ritual Steps -->
      <g transform="translate(120, 25)">
        <text font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="bold" fill="#4B286D" text-anchor="middle" x="0" y="15">HOW TO USE (วิธีใช้แผ่นมาส์กชุ่มเซรั่ม)</text>
        
        <!-- Step 1: Cleanse Face -->
        <g transform="translate(-90, 28)">
          <rect width="36" height="36" rx="4" fill="#FFFFFF" stroke="#BA68C8" stroke-width="1"/>
          <text font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="bold" fill="#7B1FA2" text-anchor="middle" x="18" y="14">1</text>
          <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#555" text-anchor="middle" x="18" y="26">ล้างหน้าสะอาด</text>
        </g>
        <!-- Step 2: Tear Sachet -->
        <g transform="translate(-30, 28)">
          <rect width="36" height="36" rx="4" fill="#FFFFFF" stroke="#BA68C8" stroke-width="1"/>
          <text font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="bold" fill="#7B1FA2" text-anchor="middle" x="18" y="14">2</text>
          <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#555" text-anchor="middle" x="18" y="26">ฉีกซองมาส์ก</text>
        </g>
        <!-- Step 3: Apply Mask -->
        <g transform="translate(30, 28)">
          <rect width="36" height="36" rx="4" fill="#FFFFFF" stroke="#BA68C8" stroke-width="1"/>
          <text font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="bold" fill="#7B1FA2" text-anchor="middle" x="18" y="14">3</text>
          <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#555" text-anchor="middle" x="18" y="26">วางแนบผิวหน้า</text>
        </g>
        <!-- Step 4: Relax 15-20 min -->
        <g transform="translate(90, 28)">
          <rect width="36" height="36" rx="4" fill="#FFFFFF" stroke="#BA68C8" stroke-width="1"/>
          <text font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="bold" fill="#7B1FA2" text-anchor="middle" x="18" y="14">4</text>
          <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#555" text-anchor="middle" x="18" y="26">มาส์ก 15-20น.</text>
        </g>

        <!-- Detailed Text Instructions in Thai and English -->
        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#444" text-anchor="middle" x="0" y="80">1. ทำความสะอาดผิวหน้าและซับให้แห้ง</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#444" text-anchor="middle" x="0" y="92">2. ฉีกซองนำแผ่นมาส์กชุ่มเซรั่มเข้มข้นออกมา คลี่วางแนบสนิทกับใบหน้า</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#444" text-anchor="middle" x="0" y="104">3. ทิ้งไว้ 15-20 นาที ลอกออก นวดเซรั่มที่เหลือให้ซึมสู่ผิวโดยไม่ต้องล้างออก</text>

        <line x1="-95" y1="116" x2="95" y2="116" stroke="#E1BEE7" stroke-width="1"/>

        <!-- Key Ingredients & Cautions -->
        <text font-family="'Segoe UI', sans-serif" font-size="7px" font-weight="bold" fill="#333" x="-95" y="128">INGREDIENTS / ส่วนประกอบสำคัญ:</text>
        <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#666" x="-95" y="139">Aqua, Golden Silk Fibroin Extract, Niacinamide, Sodium Hyaluronate,</text>
        <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#666" x="-95" y="149">Oligopeptide-1, Hydrolyzed Collagen, Centella Asiatica, Allantoin.</text>

        <text font-family="'Segoe UI', sans-serif" font-size="7px" font-weight="bold" fill="#333" x="-95" y="165">STORAGE / การเก็บรักษา: เก็บในที่แห้งและเย็น หลีกเลี่ยงแสงแดด</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7px" fill="#555" x="-95" y="176">MFG / EXP / LOT: ดูที่รอยซีลด้านล่าง (Imprint on bottom seal)</text>

        <!-- Barcode & Recycling -->
        <rect x="-95" y="195" width="80" height="30" fill="#FFF" stroke="#CCC" stroke-width="0.8"/>
        <!-- Barcode Lines -->
        <line x1="-90" y1="198" x2="-90" y2="218" stroke="#000" stroke-width="1.5"/>
        <line x1="-86" y1="198" x2="-86" y2="218" stroke="#000" stroke-width="1"/>
        <line x1="-82" y1="198" x2="-82" y2="218" stroke="#000" stroke-width="2"/>
        <line x1="-76" y1="198" x2="-76" y2="218" stroke="#000" stroke-width="1"/>
        <line x1="-71" y1="198" x2="-71" y2="218" stroke="#000" stroke-width="2.5"/>
        <line x1="-65" y1="198" x2="-65" y2="218" stroke="#000" stroke-width="1"/>
        <line x1="-60" y1="198" x2="-60" y2="218" stroke="#000" stroke-width="2"/>
        <line x1="-54" y1="198" x2="-54" y2="218" stroke="#000" stroke-width="1"/>
        <line x1="-48" y1="198" x2="-48" y2="218" stroke="#000" stroke-width="1.5"/>
        <line x1="-42" y1="198" x2="-42" y2="218" stroke="#000" stroke-width="1"/>
        <line x1="-38" y1="198" x2="-38" y2="218" stroke="#000" stroke-width="2"/>
        <line x1="-22" y1="198" x2="-22" y2="218" stroke="#000" stroke-width="1.5"/>
        <text font-family="'Courier New', monospace" font-size="6px" fill="#000" x="-92" y="224">8 859123 456789</text>

        <!-- Certs -->
        <g transform="translate(45, 208)">
          <circle cx="0" cy="0" r="11" fill="none" stroke="#666" stroke-width="0.8"/>
          <text font-family="'Segoe UI', sans-serif" font-size="6px" font-weight="bold" fill="#666" text-anchor="middle" x="0" y="2">GMP</text>
          <circle cx="30" cy="0" r="11" fill="none" stroke="#666" stroke-width="0.8"/>
          <text font-family="'Segoe UI', sans-serif" font-size="6px" font-weight="bold" fill="#666" text-anchor="middle" x="30" y="2">ISO</text>
        </g>
      </g>

      <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4B286D" text-anchor="middle" x="120" y="350">BACK VIEW (ด้านหลัง - วิธีใช้ &amp; ส่วนประกอบ)</text>
    </g>

    <!-- Dimension Callouts -->
    <!-- Width: 120 mm -->
    <line x1="0" y1="-15" x2="240" y2="-15" class="dim-line"/>
    <text class="dim-text" x="120" y="-22">120 mm (Width)</text>

    <!-- Height: 160 mm -->
    <line x1="-20" y1="0" x2="-20" y2="320" class="dim-line"/>
    <text class="dim-text" x="-35" y="160" transform="rotate(-90 -35 160)">160 mm (Height)</text>

    <!-- Tear notch height: 20 mm -->
    <line x1="250" y1="0" x2="250" y2="40" class="dim-line"/>
    <text class="dim-text" x="268" y="24">20 mm</text>
  </g>

  <!-- Bottom Technical Summary -->
  <g transform="translate(100, 670)">
    <rect width="900" height="120" rx="8" fill="#FDFBF7" stroke="#E2D9C8" stroke-width="1"/>
    <text x="20" y="24" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4B286D">FACIAL MASK SACHET (ซองมาส์กหน้าพร้อมเซรั่ม) MANUFACTURING SPECIFICATIONS:</text>
    <text x="20" y="46" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#444">• External Size: 120 × 160 mm (Foil Sachet; Sealed on 3 sides, top-sealed at 10 mm after liquid dosing).</text>
    <text x="20" y="64" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#444">• Contents: 1 Natural Golden Silk Sheet Mask pre-infused with 25g – 30ml concentrated peptide serum in the same sachet (All-in-One).</text>
    <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#444">• Thickness &amp; Clearance: Average center pillow thickness ~9.5–10.5 mm. 3 sachets stacked = ~30–31.5 mm, fitting in 33 mm deep hollow-wall tray.</text>
    <text x="20" y="100" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#444">• Finishing: 9-Color Rotogravure Printing + Soft Matte Vanish + Kurz Metallic Gold Hot Stamping Foil on brand emblem &amp; borders.</text>
  </g>
</svg>
