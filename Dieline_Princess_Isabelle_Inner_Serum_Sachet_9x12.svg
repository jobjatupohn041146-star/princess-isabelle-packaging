<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%">
  <defs>
    <style>
      .cut-line { stroke: #E60039; stroke-width: 2; fill: none; }
      .seal-area { fill: #FFE082; stroke: #FFA000; stroke-dasharray: 3,3; stroke-width: 1; opacity: 0.45; }
      .foil-gold { fill: url(#goldSerumGrad); stroke: #B8860B; stroke-width: 1; }
      .dim-line { stroke: #555555; stroke-width: 1; marker-start: url(#arr4); marker-end: url(#arr4); }
      .dim-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #222222; font-weight: bold; text-anchor: middle; }
      .label-title { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; fill: #4B286D; font-weight: bold; }
      .label-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #666666; }
      .tear-mark { stroke: #E60039; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arr4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="goldSerumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFF3E0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FCFBFF"/>
  <rect x="25" y="25" width="1050" height="800" rx="12" fill="#FFFFFF" stroke="#E5D9F2" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(60, 65)">
    <text class="label-title" x="0" y="0">PRINCESS ISABELLE — INNER SERUM POUCH (ซองเซรั่มด้านใน 9 × 12 CM)</text>
    <text class="label-sub" x="0" y="20">Finished Dimensions: 90 mm (W) × 120 mm (H) • Target Volume: 30 ml (1.01 fl. oz.) Liquid Serum</text>
    <text class="label-sub" x="0" y="36">Material: PET 12µ / AL 9µ / NY 15µ / CPP 60µ (Total 96µ High-Barrier Aluminum Foil) • Directional Tear &amp; Pour Spout</text>
  </g>

  <!-- Legend -->
  <g transform="translate(750, 50)">
    <rect width="270" height="85" rx="8" fill="#F8F6FC" stroke="#D1C4E9" stroke-width="1"/>
    <text x="15" y="18" font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="bold" fill="#333">CAD SPECIFICATION LEGEND</text>
    <line x1="15" y1="32" x2="45" y2="32" class="cut-line"/>
    <text x="55" y="35" font-family="'Segoe UI', sans-serif" font-size="10px" fill="#444">Outer Die Cut Border (90 × 120 mm)</text>
    <rect x="15" y="44" width="30" height="10" class="seal-area"/>
    <text x="55" y="52" font-family="'Segoe UI', sans-serif" font-size="10px" fill="#444">6-8 mm Heat-Seal Zone (แถบซีลปิดสนิท)</text>
    <path d="M 20,68 L 30,68 L 25,74 Z" fill="#E60039"/>
    <text x="55" y="71" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="bold" fill="#E60039">Directional Tear Notch (รอยบากฉีกเทง่าย)</text>
  </g>

  <!-- Two Panels: Front Pouch & Back Pouch -->
  <!-- Scale: 1 mm ~ 2.4 px -> 90mm = 216px, 120mm = 288px -->
  <g transform="translate(180, 200)">
    <!-- FRONT POUCH (90 x 120 mm -> 216 x 288 px) -->
    <g transform="translate(0, 0)">
      <!-- Outer Die Cut -->
      <rect x="0" y="0" width="216" height="288" rx="4" fill="url(#pouchGrad)" class="cut-line"/>

      <!-- Heat Seal Borders: 6mm sides (14.4px), 8mm top/bottom (19.2px) -->
      <rect x="0" y="0" width="216" height="20" class="seal-area"/>
      <rect x="0" y="268" width="216" height="20" class="seal-area"/>
      <rect x="0" y="20" width="14" height="248" class="seal-area"/>
      <rect x="202" y="20" width="14" height="248" class="seal-area"/>

      <!-- Directional Pour Notch (Top Right at y=28px) -->
      <path d="M 216,24 L 206,28 L 216,32 Z" fill="#E60039"/>
      <line x1="206" y1="28" x2="175" y2="28" stroke="#E60039" stroke-width="1" stroke-dasharray="3,2"/>
      <text font-family="'Segoe UI', sans-serif" font-size="7px" font-weight="bold" fill="#E60039" text-anchor="end" x="170" y="30">TEAR &amp; POUR ▼</text>

      <!-- Center Volume Bulge Indicator -->
      <ellipse cx="108" cy="144" rx="75" ry="90" fill="#FFF8E1" opacity="0.6" stroke="#FFE082" stroke-dasharray="3,3"/>
      <text font-family="'Segoe UI', sans-serif" font-size="8px" fill="#FFA000" text-anchor="middle" x="108" y="70">30 ml LIQUID CAPACITY ZONE</text>
      <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#888" text-anchor="middle" x="108" y="82">(Est. Bulge Height: 9.5 – 11 mm)</text>

      <!-- Artwork -->
      <g transform="translate(108, 120)">
        <circle cx="0" cy="0" r="14" fill="url(#goldSerumGrad)" stroke="#B8860B" stroke-width="1"/>
        <text font-family="'Playfair Display', Georgia, serif" font-size="13px" font-weight="bold" fill="#5E35B1" text-anchor="middle" x="0" y="5">PI</text>
        
        <text font-family="'Playfair Display', Georgia, serif" font-size="13px" font-weight="bold" fill="#4A148C" text-anchor="middle" x="0" y="28">Princess Isabelle</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7px" letter-spacing="1.5" fill="#B8860B" font-weight="bold" text-anchor="middle" x="0" y="38">FRESH GOLDEN SERUM</text>
        
        <rect x="-45" y="48" width="90" height="20" rx="10" fill="#5E35B1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="bold" fill="#FFD54F" text-anchor="middle" x="0" y="62">30 ml (1.01 fl. oz.)</text>

        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#444" text-anchor="middle" x="0" y="82">Golden Silk Fibroin • Bio-Active</text>
        <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#777" text-anchor="middle" x="0" y="94">Sealed for Peak Freshness</text>
      </g>

      <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4B286D" text-anchor="middle" x="108" y="320">FRONT VIEW (ด้านหน้า)</text>
    </g>

    <!-- BACK POUCH (90 x 120 mm -> 216 x 288 px) -->
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="216" height="288" rx="4" fill="url(#pouchGrad)" class="cut-line"/>

      <rect x="0" y="0" width="216" height="20" class="seal-area"/>
      <rect x="0" y="268" width="216" height="20" class="seal-area"/>
      <rect x="0" y="20" width="14" height="248" class="seal-area"/>
      <rect x="202" y="20" width="14" height="248" class="seal-area"/>

      <!-- Directional Pour Notch on mirror side -->
      <path d="M 0,24 L 10,28 L 0,32 Z" fill="#E60039"/>

      <g transform="translate(108, 40)">
        <text font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="bold" fill="#4B286D" text-anchor="middle" x="0" y="10">HOW TO ACTIVATE (วิธีเปิดผสม)</text>
        
        <path d="M -25,25 L 25,25 L 15,35 L -15,35 Z" fill="#FFF" stroke="#FFA000" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#B8860B" text-anchor="middle" x="0" y="32">เทลงบนแผ่นมาส์กแห้ง</text>

        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#444" text-anchor="middle" x="0" y="60">1. ฉีกตามรอยบากที่มุมบนขวา</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#444" text-anchor="middle" x="0" y="74">2. เทเซรั่ม 30 มล. ชโลมให้ทั่วแผ่นมาส์ก</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" fill="#444" text-anchor="middle" x="0" y="88">3. รอ 10 วินาทีให้ใยไหมดูดซับสารอาหารเต็มที่</text>

        <line x1="-80" y1="102" x2="80" y2="102" stroke="#FFE082" stroke-width="1"/>

        <text font-family="'Segoe UI', sans-serif" font-size="7px" font-weight="bold" fill="#333" x="-80" y="118">Net Volume: 30 ml (Single Use)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#666" x="-80" y="130">Made for Princess Isabelle Skincare</text>
        <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#666" x="-80" y="142">Under Royal Beauty Standards</text>
        <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#888" x="-80" y="156">Lot &amp; EXP marked on bottom seal</text>

        <!-- Recycling icon -->
        <g transform="translate(0, 185)">
          <polygon points="0,-12 12,8 -12,8" fill="none" stroke="#777" stroke-width="1"/>
          <text font-family="'Segoe UI', sans-serif" font-size="6px" fill="#555" text-anchor="middle" x="0" y="2">ALU</text>
          <text font-family="'Segoe UI', sans-serif" font-size="6.5px" fill="#666" text-anchor="middle" x="0" y="18">RECYCLABLE FOIL</text>
        </g>
      </g>

      <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4B286D" text-anchor="middle" x="108" y="320">BACK VIEW (ด้านหลัง - สเปกและวิธีเท)</text>
    </g>

    <!-- Dimension Callouts -->
    <line x1="0" y1="-15" x2="216" y2="-15" class="dim-line"/>
    <text class="dim-text" x="108" y="-22">90 mm (Width)</text>

    <line x1="-20" y1="0" x2="-20" y2="288" class="dim-line"/>
    <text class="dim-text" x="-35" y="144" transform="rotate(-90 -35 144)">120 mm (Height)</text>
  </g>

  <!-- Technical Summary -->
  <g transform="translate(100, 670)">
    <rect width="900" height="120" rx="8" fill="#FDFBF7" stroke="#E2D9C8" stroke-width="1"/>
    <text x="20" y="24" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4B286D">INNER SERUM POUCH (ซองเซรั่มด้านใน) MANUFACTURING SPECIFICATIONS:</text>
    <text x="20" y="46" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#444">• Precise Dimensions: 90 mm (W) × 120 mm (H). Designed to easily slide inside the 120 × 160 mm outer sachet.</text>
    <text x="20" y="64" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#444">• Volumetric Displacement: 30 ml liquid causes center thickness bulge of approx 9.5 – 11 mm. Pouch withstands 50 kg burst compression test.</text>
    <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#444">• Oxygen &amp; Light Barrier: AL layer guarantees zero UV/light penetration and ultra-low OTR (&lt; 0.1 cc/m²·day) to keep fresh silk peptides 100% active.</text>
    <text x="20" y="100" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#444">• Pouring Geometry: 45° angled tear notch channel allows controlled single-stream pouring without spilling onto user's hands.</text>
  </g>
</svg>
