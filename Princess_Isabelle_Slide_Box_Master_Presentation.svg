<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      .bg-grad { fill: url(#boardBg); }
      .brand-title { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: bold; fill: #4A235A; }
      .brand-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; letter-spacing: 4px; fill: #B8860B; font-weight: bold; }
      .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 19px; font-weight: bold; fill: #4A235A; }
      .card-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; fill: #555555; line-height: 1.5; }
      .dim-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #B8860B; }
    </style>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAFD"/>
      <stop offset="50%" stop-color="#F8EFFB"/>
      <stop offset="100%" stop-color="#F1E3F6"/>
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4FD"/>
      <stop offset="100%" stop-color="#E9DBF0"/>
    </linearGradient>
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EEFA"/>
      <stop offset="100%" stop-color="#E2CFEC"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4A235A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-grad"/>
  <rect x="30" y="30" width="1540" height="940" rx="16" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Master Presentation Header -->
  <g transform="translate(80, 80)">
    <circle cx="28" cy="28" r="28" fill="url(#goldLuxury)"/>
    <text font-family="'Playfair Display', Georgia, serif" font-size="28px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="28" y="38">PI</text>
    <g transform="translate(75, 10)">
      <text class="brand-title" x="0" y="20">Princess Isabelle</text>
      <text class="brand-sub" x="0" y="40">A ROYAL TOUCH IN EVERY DETAIL • BEAUTY WOVEN IN SILK</text>
    </g>
    <g transform="translate(900, 10)">
      <rect width="480" height="48" rx="24" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.5"/>
      <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="240" y="28">
        SHORT-SIDE SLIDE BOX &amp; 10 mm HOLLOW-WALL TRAY (CEILK STYLE)
      </text>
    </g>
  </g>

  <!-- Left Card: Exploded Architecture (Short-Side Slide & Hollow-Wall Frame) -->
  <g transform="translate(80, 180)">
    <rect width="890" height="480" rx="16" fill="#FFFFFF" filter="url(#dropShadow)" stroke="#E8DAF0" stroke-width="1"/>
    
    <g transform="translate(30, 38)">
      <text class="card-title" x="0" y="0">Short-Side Slide Mechanism &amp; Reinforced 10 mm Hollow-Wall Frame</text>
      <text class="card-desc" x="0" y="22">สไลด์ออกด้านสั้น (Top Pull) • ถาดในพับขอบเบิ้ล 10 มม. แข็งแรงพิเศษ • หลุมใน 130×170 มม. ลึกสุทธิ 33 มม. (&gt; 3 ซม.)</text>
    </g>

    <!-- 3D Exploded Representation of Short-Side Box -->
    <g transform="translate(80, 100)">
      <!-- 1. Outer Sleeve (Bottom/Middle) -->
      <g transform="translate(40, 100)">
        <!-- 3D Sleeve Body (153 x 193 x 37 mm) -->
        <polygon points="0,50 140,10 270,50 130,90" fill="url(#sleeveGrad)" stroke="#D4AF37" stroke-width="2"/>
        <polygon points="0,50 130,90 130,160 0,120" fill="#EBDCF0" stroke="#BA68C8" stroke-width="1.5"/>
        <polygon points="130,90 270,50 270,120 130,160" fill="#DEC7E5" stroke="#BA68C8" stroke-width="1.5"/>

        <!-- Gold Crest on Sleeve -->
        <ellipse cx="135" cy="50" rx="26" ry="12" fill="url(#goldLuxury)"/>
        <text font-family="'Playfair Display', serif" font-size="10px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="135" y="54">Princess Isabelle</text>

        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" x="65" y="195">1. Outer Sleeve (ปลอกสวมด้านนอก)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#B8860B" x="65" y="212">153 × 193 × 37 mm (สไลด์ด้านสั้น)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10px" fill="#666" x="65" y="228">ช่องสวม 151×35 มม. สไตล์ CEILK</text>
      </g>

      <!-- Upward Arrow (Short Side Pull Direction) -->
      <g transform="translate(350, 150)">
        <path d="M 0,40 L 0,-25 M -8,-15 L 0,-25 L 8,-15" fill="none" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="bold" fill="#7B1FA2" text-anchor="middle" x="0" y="65">สไลด์ออกด้านสั้น (Top Pull)</text>
      </g>

      <!-- 2. Inner Tray with 10 mm Hollow Border (Elevated to the right) -->
      <g transform="translate(420, 30)">
        <!-- Outer Frame -->
        <polygon points="0,50 140,10 260,50 120,90" fill="url(#trayGrad)" stroke="#7B1FA2" stroke-width="2"/>
        <polygon points="0,50 120,90 120,150 0,110" fill="#E6CEF0" stroke="#BA68C8" stroke-width="1.5"/>
        <polygon points="120,90 260,50 260,110 120,150" fill="#D8BEE4" stroke="#BA68C8" stroke-width="1.5"/>

        <!-- 10 mm Hollow-Wall Raised Border Indicator -->
        <polygon points="14,52 135,16 242,52 120,86" fill="#FBF5FD" stroke="#D4AF37" stroke-width="1.5"/>

        <!-- 3 Sachets Nested inside Cavity -->
        <polygon points="22,53 133,20 232,53 120,83" fill="url(#goldLuxury)" stroke="#B8860B" stroke-width="1"/>

        <!-- Champagne Gold Ribbon on Short Edge (Top) -->
        <g transform="translate(70, 30)">
          <path d="M 0,0 L -8,-25 C -8,-32 8,-32 8,-25 L 0,0 Z" fill="url(#goldLuxury)" stroke="#B8860B" stroke-width="1.5"/>
          <text font-family="'Segoe UI', sans-serif" font-size="8.5px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="0" y="-35">PULL</text>
        </g>

        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" x="40" y="185">2. Inner Tray with 10 mm Border</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#B8860B" x="40" y="202">หลุมใน 130 × 170 mm • ลึกสุทธิ 33 mm</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10px" fill="#666" x="40" y="218">ขนาดนอกถาด: 150 × 190 × 34 mm</text>
      </g>
    </g>

    <!-- Bottom Engineering Verification Banner -->
    <g transform="translate(35, 415)">
      <rect width="820" height="42" rx="8" fill="#FAF5FC" stroke="#E1BEE7" stroke-width="1"/>
      <text font-family="'Segoe UI', sans-serif" font-size="11.5px" fill="#4A235A" x="20" y="26">
        ✓ <strong>ความลึกสุทธิ 33 mm (สูงกว่า 3 cm):</strong> รองรับซองมาส์ก 12×16 cm + เซรั่ม 30ml ซ้อนกัน 3 แผ่นหนารวม ~30-32 mm พอดี ไม่ล้นขอบ
      </text>
    </g>
  </g>

  <!-- Right Card: Dual-Sachet & 10 mm Frame Breakdown -->
  <g transform="translate(1000, 180)">
    <rect width="520" height="480" rx="16" fill="#FFFFFF" filter="url(#dropShadow)" stroke="#E8DAF0" stroke-width="1"/>
    
    <g transform="translate(30, 38)">
      <text class="card-title" x="0" y="0">Dimensional Blueprint Breakdown</text>
      <text class="card-desc" x="0" y="22">เปรียบเทียบขนาดซองมาส์ก vs ขนาดหลุมถาดใน vs ขนาดปลอกสวม</text>
    </g>

    <g transform="translate(40, 85)">
      <!-- Dimension Comparison Flow -->
      <g transform="translate(0, 0)">
        <rect width="440" height="70" rx="8" fill="#FAF5FD" stroke="#BA68C8" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" x="15" y="24">1. ขนาดซองมาส์ก (Sachet Size):</text>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#B8860B" x="15" y="44">120 × 160 mm (12 × 16 cm)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#666" x="15" y="60">3 ซองบรรจุเซรั่ม 30ml วางซ้อนกัน หนา ~30 – 32 mm</text>
      </g>

      <!-- Arrow down -->
      <text font-family="'Segoe UI', sans-serif" font-size="18px" font-weight="bold" fill="#D4AF37" x="215" y="95">▼</text>

      <g transform="translate(0, 105)">
        <rect width="440" height="85" rx="8" fill="#FFFDF7" stroke="#FFA000" stroke-width="1.5"/>
        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" x="15" y="22">2. ขนาดหลุมในถาด (Inner Cavity):</text>
        <text font-family="'Segoe UI', sans-serif" font-size="14px" font-weight="bold" fill="#E65100" x="15" y="42">130 × 170 mm • ลึกสุทธิ 33 mm</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#444" x="15" y="60">• มีระยะเผื่อข้างละ 5 mm วางซองได้สะดวก ไม่เบียด</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#444" x="15" y="75">• ลึก 33 mm (สูงกว่า 3 cm) วาง 3 ซองมิดชิด ไม่ดันขอบบน</text>
      </g>

      <text font-family="'Segoe UI', sans-serif" font-size="18px" font-weight="bold" fill="#D4AF37" x="215" y="215">▼</text>

      <g transform="translate(0, 225)">
        <rect width="440" height="85" rx="8" fill="#F5EEFA" stroke="#7B1FA2" stroke-width="1.5"/>
        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" x="15" y="22">3. ขนาดรวมขอบบ่า 10 mm &amp; ปลอกสวมนอก:</text>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#5B2C6F" x="15" y="42">• ถาดในรวมขอบ: 150 × 190 × 34 mm (ขอบหนา 10 mm)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#B8860B" x="15" y="62">• ปลอกสวมนอกสำเร็จ: 153 × 193 × 37 mm</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#666" x="15" y="78">• ปากช่องสวม 153 mm สไลด์เข้า-ออกด้านสั้น เรียบลื่น ไร้แรงฝืด</text>
      </g>
    </g>

    <!-- 100% Exact Art Guarantee Tag -->
    <g transform="translate(25, 420)">
      <rect width="470" height="40" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
      <text font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="bold" fill="#2E7D32" x="15" y="24">
        ✓ ยืนยันสีและโลโก้ตรงตามภาพต้นฉบับ 100% เป๊ะ ห้ามเปลี่ยนแปลง
      </text>
    </g>
  </g>

  <!-- Bottom: 4 CAD Dieline Summary Cards -->
  <g transform="translate(80, 690)">
    <rect width="1440" height="230" rx="16" fill="#FFFFFF" filter="url(#dropShadow)" stroke="#E8DAF0" stroke-width="1"/>
    
    <g transform="translate(40, 28)">
      <text class="card-title" x="0" y="0">Updated CAD Dieline Specifications (Short-Side Slide System)</text>
      <text class="card-desc" x="0" y="20">แบบแปลนไดไลน์ 1:1 ปรับปรุงโครงสร้างสไลด์ด้านสั้น และถาดในมีขอบพับเบิ้ล 10 มม. พร้อมสั่งผลิต</text>
    </g>

    <g transform="translate(40, 70)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="320" height="105" rx="8" fill="#FAF5FC" stroke="#D7BDE2" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#4A235A" x="16" y="26">1. ปลอกสวมสไลด์ด้านสั้น (.SVG)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#777" x="16" y="46">ขนาดสำเร็จ: 153 × 193 × 37 mm (สไตล์ CEILK)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#B8860B" x="16" y="66">✓ เปิดปากช่องด้านสั้น 153 mm • ฟอยล์ทองแท้</text>
        <text font-family="'Segoe UI', sans-serif" font-size="9.5px" fill="#888" x="16" y="86">Dieline_Princess_Isabelle_Slide_Sleeve.svg</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(345, 0)">
        <rect width="320" height="105" rx="8" fill="#FAF5FC" stroke="#D7BDE2" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#4A235A" x="16" y="26">2. ถาดในขอบพับเบิ้ล 10 mm (.SVG)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#777" x="16" y="46">หลุมใน: 130 × 170 mm • ลึกสุทธิ: 33 mm</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#B8860B" x="16" y="66">✓ ขอบบ่าหนา 10 mm • ช่องริบบิ้นทองด้านสั้น</text>
        <text font-family="'Segoe UI', sans-serif" font-size="9.5px" fill="#888" x="16" y="86">Dieline_Princess_Isabelle_Slide_Drawer.svg</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(690, 0)">
        <rect width="320" height="105" rx="8" fill="#FAF5FC" stroke="#D7BDE2" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#4A235A" x="16" y="26">3. ซองมาส์กชุ่มเซรั่ม 12×16 cm (.SVG)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#777" x="16" y="46">ขนาด: 120 × 160 mm (All-in-One)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#B8860B" x="16" y="66">✓ แผ่นมาส์กไหมชุ่มเซรั่มสด 30ml ในซองเดียว</text>
        <text font-family="'Segoe UI', sans-serif" font-size="9.5px" fill="#888" x="16" y="86">Dieline_Princess_Isabelle_Outer_Sachet_12x16.svg</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(1035, 0)">
        <rect width="320" height="105" rx="8" fill="#FAF5FC" stroke="#D7BDE2" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#4A235A" x="16" y="26">4. [ทางเลือก] ซองเซรั่มแยก 9×12 cm</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#777" x="16" y="46">ขนาด: 90 × 120 mm (ความจุ 30 ml)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#B8860B" x="16" y="66">✓ ออปชันเสริมสำหรับกรณีผลิตแยกซองคู่</text>
        <text font-family="'Segoe UI', sans-serif" font-size="9.5px" fill="#888" x="16" y="86">Dieline_Princess_Isabelle_Inner_Serum_Sachet_9x12.svg</text>
      </g>
    </g>
  </g>
</svg>
