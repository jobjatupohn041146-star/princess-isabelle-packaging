<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      .bg-grad { fill: url(#boardBg); }
      .brand-title { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: bold; fill: #4A235A; }
      .brand-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; letter-spacing: 4px; fill: #B8860B; font-weight: bold; }
      .section-badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #5B2C6F; }
      .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 19px; font-weight: bold; fill: #4A235A; }
      .card-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; fill: #555555; line-height: 1.5; }
      .dim-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #B8860B; }
    </style>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAFD"/>
      <stop offset="50%" stop-color="#F7EFFB"/>
      <stop offset="100%" stop-color="#F0E2F5"/>
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4FD"/>
      <stop offset="100%" stop-color="#E8DAF0"/>
    </linearGradient>
    <linearGradient id="drawerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E9F8"/>
      <stop offset="100%" stop-color="#DEC6EA"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4A235A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-grad"/>
  <rect x="30" y="30" width="1540" height="940" rx="16" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Master Presentation Header -->
  <g transform="translate(80, 80)">
    <circle cx="28" cy="28" r="28" fill="url(#goldLuxury)"/>
    <text font-family="'Playfair Display', Georgia, serif" font-size="28px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="28" y="38">PI</text>
    <g transform="translate(75, 10)">
      <text class="brand-title" x="0" y="20">Princess Isabelle</text>
      <text class="brand-sub" x="0" y="40">A ROYAL TOUCH IN EVERY DETAIL • BEAUTY WOVEN IN SILK</text>
    </g>
    <g transform="translate(1000, 10)">
      <rect width="380" height="48" rx="24" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.5"/>
      <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="190" y="28">
        MASTER PACKAGING SPECIFICATION • V2.0 SLIDE BOX
      </text>
    </g>
  </g>

  <!-- Left: Exploded & Structural 3D Representation of Slide Box System -->
  <g transform="translate(80, 180)">
    <rect width="880" height="480" rx="16" fill="#FFFFFF" filter="url(#dropShadow)" stroke="#E8DAF0" stroke-width="1"/>
    
    <!-- Title -->
    <g transform="translate(30, 40)">
      <text class="card-title" x="0" y="0">CEILK-Style Rigid Slide Box &amp; Dual-Chamber Architecture</text>
      <text class="card-desc" x="0" y="22">Horizontal glide mechanism with 15 mm Champagne Gold Satin Ribbon pull tab • Houses 3 stacked dual-sachets</text>
    </g>

    <!-- 3D Isometric / Exploded Drawing of the Box -->
    <g transform="translate(60, 100)">
      <!-- 1. Outer Sleeve (Placing on the left) -->
      <g transform="translate(40, 60)">
        <!-- Sleeve 3D Body -->
        <polygon points="0,70 120,20 280,70 160,120" fill="url(#sleeveGrad)" stroke="#D4AF37" stroke-width="2"/>
        <polygon points="0,70 160,120 160,200 0,150" fill="#EADBF0" stroke="#BA68C8" stroke-width="1.5"/>
        <polygon points="160,120 280,70 280,150 160,200" fill="#D9C2E3" stroke="#BA68C8" stroke-width="1.5"/>
        
        <!-- Foil Crest on Sleeve Top -->
        <ellipse cx="140" cy="70" rx="24" ry="12" fill="url(#goldLuxury)"/>
        <text font-family="'Playfair Display', serif" font-size="10px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="140" y="74">Princess Isabelle</text>

        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" x="80" y="235">1. Outer Rigid Sleeve</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#B8860B" x="80" y="252">132 × 174 × 43 mm</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10px" fill="#666" x="80" y="268">2.0 mm Greyboard + Soft-Touch</text>
      </g>

      <!-- Arrow: Slide Direction -->
      <g transform="translate(350, 150)">
        <path d="M 0,0 L 70,0 L 60,-8 M 70,0 L 60,8" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="bold" fill="#7B1FA2" text-anchor="middle" x="35" y="-14">Smooth Horizontal Slide</text>
      </g>

      <!-- 2. Inner Drawer Tray (Partially Pulled Out to the Right) -->
      <g transform="translate(440, 60)">
        <!-- Drawer Tray 3D Body -->
        <polygon points="0,70 120,20 270,70 150,120" fill="url(#drawerGrad)" stroke="#7B1FA2" stroke-width="1.5"/>
        <polygon points="0,70 150,120 150,190 0,140" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1"/>
        <polygon points="150,120 270,70 270,140 150,190" fill="#CE93D8" stroke="#BA68C8" stroke-width="1"/>

        <!-- 3 Stacked Sachets Inside Drawer -->
        <polygon points="15,75 115,35 245,75 145,115" fill="#FAF2FD" stroke="#D4AF37" stroke-width="1"/>
        <polygon points="15,68 115,28 245,68 145,108" fill="#FAF2FD" stroke="#D4AF37" stroke-width="1"/>
        <polygon points="15,61 115,21 245,61 145,101" fill="url(#goldLuxury)" stroke="#B8860B" stroke-width="1"/>

        <!-- Ribbon Pull Tab on Right Wall -->
        <path d="M 210,95 Q 260,115 285,110 Q 295,105 280,95 Z" fill="url(#goldLuxury)" stroke="#B8860B" stroke-width="1.5"/>
        <text font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="bold" fill="#4A235A" x="250" y="85">PULL</text>

        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" x="50" y="235">2. Inner Drawer Tray + Ribbon</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#B8860B" x="50" y="252">126 × 168 × 38 mm (Depth: 38 mm)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10px" fill="#666" x="50" y="268">Houses 3 Dual-Sachets (Thickness: ~34.5 mm)</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(40, 410)">
      <rect width="800" height="45" rx="8" fill="#FAF5FC" stroke="#E1BEE7" stroke-width="1"/>
      <text font-family="'Segoe UI', sans-serif" font-size="12px" fill="#4A235A" x="20" y="26">
        ✓ <strong>Zero Bottle Waste:</strong> Replaces fragile 30ml glass dropper bottles with light, sealed, leak-proof fresh aluminum pouches.
      </text>
    </g>
  </g>

  <!-- Right: Dual-Sachet Fresh-Mix Ritual Breakdown -->
  <g transform="translate(1000, 180)">
    <rect width="520" height="480" rx="16" fill="#FFFFFF" filter="url(#dropShadow)" stroke="#E8DAF0" stroke-width="1"/>
    
    <!-- Title -->
    <g transform="translate(30, 40)">
      <text class="card-title" x="0" y="0">Fresh-Mix Dual-Pouch System</text>
      <text class="card-desc" x="0" y="22">1 Set = Outer Sachet (12×16 cm) + Inner Serum (9×12 cm, 30 ml)</text>
    </g>

    <!-- Visual Sachet Breakdown -->
    <g transform="translate(40, 90)">
      <!-- Outer Sachet 12x16 cm Graphic -->
      <g transform="translate(0, 0)">
        <rect width="180" height="240" rx="6" fill="#FDFBFE" stroke="#D4AF37" stroke-width="2"/>
        <rect x="0" y="0" width="180" height="16" fill="#F3E5F5"/>
        <rect x="0" y="224" width="180" height="16" fill="#F3E5F5"/>
        <!-- Tear Notches -->
        <polygon points="0,28 8,32 0,36" fill="#E60039"/>
        <polygon points="180,28 172,32 180,36" fill="#E60039"/>
        
        <circle cx="90" cy="55" r="16" fill="url(#goldLuxury)"/>
        <text font-family="'Playfair Display', serif" font-size="13px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="90" y="90">Princess Isabelle</text>
        <text font-family="'Segoe UI', sans-serif" font-size="8px" font-weight="bold" fill="#B8860B" text-anchor="middle" x="90" y="105">GOLDEN SILK MASK</text>
        <rect x="25" y="125" width="130" height="20" rx="10" fill="#F3E5F5"/>
        <text font-family="'Segoe UI', sans-serif" font-size="7.5px" font-weight="bold" fill="#7B1FA2" text-anchor="middle" x="90" y="138">FRESH-MIX DUAL POUCH</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7px" fill="#777" text-anchor="middle" x="90" y="165">1 Dry Silk Sheet + 1 Serum 30ml</text>

        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="90" y="270">Outer Sachet (ซองนอก)</text>
        <text class="dim-tag" text-anchor="middle" x="90" y="286">120 × 160 mm (12 × 16 cm)</text>
      </g>

      <!-- Plus sign -->
      <text font-family="'Segoe UI', sans-serif" font-size="28px" font-weight="bold" fill="#B8860B" x="205" y="130">+</text>

      <!-- Inner Serum Pouch 9x12 cm Graphic -->
      <g transform="translate(250, 25)">
        <rect width="150" height="200" rx="6" fill="#FFFDF7" stroke="#FFB300" stroke-width="2"/>
        <rect x="0" y="0" width="150" height="14" fill="#FFE082" opacity="0.6"/>
        <rect x="0" y="186" width="150" height="14" fill="#FFE082" opacity="0.6"/>
        <!-- Directional notch -->
        <polygon points="150,20 142,24 150,28" fill="#E60039"/>
        <text font-family="'Segoe UI', sans-serif" font-size="6.5px" font-weight="bold" fill="#E60039" text-anchor="end" x="138" y="26">POUR ▼</text>

        <circle cx="75" cy="55" r="14" fill="url(#goldLuxury)"/>
        <text font-family="'Playfair Display', serif" font-size="11px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="75" y="85">Fresh Serum</text>
        <rect x="35" y="100" width="80" height="20" rx="10" fill="#5E35B1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="bold" fill="#FFD54F" text-anchor="middle" x="75" y="114">30 ml</text>
        <text font-family="'Segoe UI', sans-serif" font-size="7px" fill="#666" text-anchor="middle" x="75" y="140">Active Silk Peptides</text>

        <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#4A235A" text-anchor="middle" x="75" y="245">Inner Serum (ซองเซรั่มใน)</text>
        <text class="dim-tag" text-anchor="middle" x="75" y="261">90 × 120 mm (9 × 12 cm)</text>
      </g>
    </g>

    <!-- Bulge explanation box -->
    <g transform="translate(25, 400)">
      <rect width="470" height="55" rx="8" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1"/>
      <text font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="bold" fill="#F57F17" x="15" y="22">
        💡 30 ml Volume Pillow Bulge Allowance:
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#555" x="15" y="38">
        Bulge is ~10 mm. Stack of 3 sachets = ~34.5 mm height. Drawer depth of 38 mm allows smooth slide without resistance!
      </text>
    </g>
  </g>

  <!-- Bottom: 4 CAD Dieline Quick Index -->
  <g transform="translate(80, 690)">
    <rect width="1440" height="230" rx="16" fill="#FFFFFF" filter="url(#dropShadow)" stroke="#E8DAF0" stroke-width="1"/>
    
    <g transform="translate(40, 30)">
      <text class="card-title" x="0" y="0">Vector CAD Dieline Library (1:1 Print Production Ready)</text>
      <text class="card-desc" x="0" y="20">All 4 dielines conform to ISO packaging standards with die cut lines, score creases, and foil stamping masks.</text>
    </g>

    <g transform="translate(40, 75)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="320" height="100" rx="8" fill="#FAF5FC" stroke="#D7BDE2" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#4A235A" x="16" y="28">1. Outer Rigid Sleeve (.SVG)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#777" x="16" y="48">Size: 132 × 174 × 43 mm (Wrap over 2mm Greyboard)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#B8860B" x="16" y="68">✓ 15mm turn-ins • Gold foil stamp • Embossed crest</text>
        <text font-family="'Segoe UI', sans-serif" font-size="9.5px" fill="#888" x="16" y="86">Dieline_Princess_Isabelle_Slide_Sleeve.svg</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(345, 0)">
        <rect width="320" height="100" rx="8" fill="#FAF5FC" stroke="#D7BDE2" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#4A235A" x="16" y="28">2. Inner Drawer Tray (.SVG)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#777" x="16" y="48">Size: 126 × 168 × 38 mm (Depth: 38 mm)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#B8860B" x="16" y="68">✓ 16mm ribbon die-cut slit • 90° V-groove corners</text>
        <text font-family="'Segoe UI', sans-serif" font-size="9.5px" fill="#888" x="16" y="86">Dieline_Princess_Isabelle_Slide_Drawer.svg</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(690, 0)">
        <rect width="320" height="100" rx="8" fill="#FAF5FC" stroke="#D7BDE2" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#4A235A" x="16" y="28">3. Outer Mask Sachet (.SVG)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#777" x="16" y="48">Size: 120 × 160 mm (12 × 16 cm)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#B8860B" x="16" y="68">✓ 8-10mm heat seals • Dual V-notches at 20mm</text>
        <text font-family="'Segoe UI', sans-serif" font-size="9.5px" fill="#888" x="16" y="86">Dieline_Princess_Isabelle_Outer_Sachet_12x16.svg</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(1035, 0)">
        <rect width="320" height="100" rx="8" fill="#FAF5FC" stroke="#D7BDE2" stroke-width="1"/>
        <text font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="bold" fill="#4A235A" x="16" y="28">4. Inner Serum Pouch (.SVG)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="11px" fill="#777" x="16" y="48">Size: 90 × 120 mm (9 × 12 cm / 30 ml)</text>
        <text font-family="'Segoe UI', sans-serif" font-size="10.5px" fill="#B8860B" x="16" y="68">✓ 100% barrier ALU • 45° directional pour notch</text>
        <text font-family="'Segoe UI', sans-serif" font-size="9.5px" fill="#888" x="16" y="86">Dieline_Princess_Isabelle_Inner_Serum_Sachet_9x12.svg</text>
      </g>
    </g>
  </g>
</svg>
